version: '3.8'
services:
  # Service pour l'application Laravel avec PHP-FPM
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - laravel_network
    depends_on:
      - db

  # Service Nginx pour servir l'application
  nginx:
    image: nginx:latest
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "80:80"  # Sur Play with Docker, utilisez le port 80
    volumes:
      - ./:/var/www/html
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - laravel_network
    depends_on:
      - app

  # Service pour la base de données MySQL
  db:
    image: mysql:8
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: esteban
      MYSQL_ROOT_PASSWORD: 
      MYSQL_USER: esteban
      MYSQL_PASSWORD: esteban
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql  # Utilisation d'un volume nommé pour plus de stabilité
    networks:
      - laravel_network

networks:
  laravel_network:
    driver: bridge

volumes:
  db-data:  # Définition du volume nommé